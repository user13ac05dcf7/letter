name: Flatpak

on:
  # Any branch, so feature branches of this fork get a bundle to try.
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

env:
  # Builds of this branch are signed and published as a Flatpak repository on
  # GitHub Pages, which Dakota preinstalls Letter from.
  PUBLISH_REF: refs/heads/flatpak-ci
  COLLECTION_ID: io.github.user13ac05dcf7.Letter
  APP_ID: io.github.user13ac05dcf7.Letter
  # The ID this fork shipped under before; installs of it are rebased.
  OLD_APP_ID: io.github.stalvatero.Letter

jobs:
  flatpak:
    name: Build bundle
    runs-on: ubuntu-24.04
    # The image ships flatpak-builder with the GNOME 51 Platform and SDK
    # preinstalled, matching runtime-version in the manifest.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Import the signing key
        id: key
        if: github.ref == env.PUBLISH_REF
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          echo "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      # flatpak build-export binds each commit to the repository's collection
      # ID, which clients need to match the remote that Dakota preinstalls from.
      - name: Create the repository
        if: github.ref == env.PUBLISH_REF
        run: |
          set -euo pipefail
          command -v ostree >/dev/null || dnf install -y ostree
          ostree init --repo=repo --mode=archive-z2 --collection-id="$COLLECTION_ID"

      # The first run builds EDS, Evolution and evolution-ews from source and
      # takes a while; later runs restore those modules from the cache.
      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: io.github.user13ac05dcf7.Letter.yml
          bundle: Letter-x86_64.flatpak
          branch: stable
          gpg-sign: ${{ steps.key.outputs.fingerprint }}
          cache-key: flatpak-builder-${{ hashFiles('io.github.user13ac05dcf7.Letter.yml', 'patches/**', 'flatpak/**') }}

      - name: Prepare the repository site
        if: github.ref == env.PUBLISH_REF
        env:
          FINGERPRINT: ${{ steps.key.outputs.fingerprint }}
        run: |
          set -euo pipefail
          ref="app/$APP_ID/x86_64/stable"
          binding=$(ostree show --repo=repo --print-metadata-key=ostree.collection-binding "$ref")
          if [ "$binding" != "'$COLLECTION_ID'" ]; then
            echo "ERROR: $ref is bound to $binding, not $COLLECTION_ID" >&2
            exit 1
          fi
          # Mark the old ID end-of-life: `flatpak update` then installs the new
          # ID in its place, and Flatpak moves ~/.var/app/$OLD_APP_ID over.
          flatpak build-commit-from --gpg-sign="$FINGERPRINT" \
            --end-of-life-rebase="$OLD_APP_ID=$APP_ID" \
            --src-ref="$ref" repo "app/$OLD_APP_ID/x86_64/stable"
          flatpak build-update-repo --gpg-sign="$FINGERPRINT" --generate-static-deltas \
            --prune --title="Letter" --default-branch=stable repo

          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          key=$(gpg --batch --export "$FINGERPRINT" | base64 -w0)
          mkdir -p site
          mv repo site/repo
          cat > site/letter.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=Letter
          Url=$url/repo/
          Homepage=https://github.com/$GITHUB_REPOSITORY
          Comment=Letter builds from $GITHUB_REPOSITORY
          DefaultBranch=stable
          DeployCollectionID=$COLLECTION_ID
          GPGKey=$key
          EOF
          cat > "site/$APP_ID.flatpakref" <<EOF
          [Flatpak Ref]
          Title=Letter
          Name=$APP_ID
          Branch=stable
          Url=$url/repo/
          IsRuntime=false
          SuggestRemoteName=letter
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          DeployCollectionID=$COLLECTION_ID
          GPGKey=$key
          EOF
          # Links to the old ID's file keep working and install the new ID.
          cp "site/$APP_ID.flatpakref" "site/$OLD_APP_ID.flatpakref"
          printf '<!doctype html><title>Letter Flatpak</title><p><a href="%s.flatpakref">Install Letter</a> · <a href="letter.flatpakrepo">Add the repository</a></p>\n' \
            "$APP_ID" > site/index.html

      - name: Upload the repository site
        if: github.ref == env.PUBLISH_REF
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  publish:
    name: Publish repository
    needs: flatpak
    if: github.ref == 'refs/heads/flatpak-ci'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: flatpak-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
